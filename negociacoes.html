<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Negociações — SiteSeller</title>
  <meta name="description" content="Conversas de negociação com os clientes.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Aplica o tema salvo antes da primeira pintura, evitando piscar. -->
  <script>
    try {
      var c = JSON.parse(localStorage.getItem('siteseller:configuracoes') || 'null');
      if (c && c.tema === 'claro') document.documentElement.dataset.tema = 'claro';
    } catch (e) { /* mantém o tema escuro padrão */ }
  </script>
</head>
<body data-pagina="negociacoes">
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal"></aside>

    <div class="app__principal">
      <header class="topbar" id="topbar"></header>

      <main class="conteudo" id="conteudo" tabindex="-1">
        <header class="pagina__cabecalho">
          <div>
            <p class="sobrelinha">Conversas</p>
            <h2>Negociações com clientes</h2>
            <p>Os clientes são simulados por regras: orçamento disponível, prazo, necessidades e perfil definem cada resposta. Nada é sorteado.</p>
          </div>
        </header>

        <div class="negociacoes" id="negociacoes">
          <aside class="cartao negociacoes__lista" id="lista-negociacoes" aria-label="Lista de negociações"></aside>
          <section class="cartao negociacoes__detalhe" id="detalhe-negociacao" aria-label="Conversa selecionada" aria-live="polite"></section>
        </div>
      </main>
    </div>
  </div>

  <noscript><p style="padding:24px;color:#F5E8E7">O SiteSeller precisa de JavaScript ativado para funcionar.</p></noscript>

  <script src="assets/vendor/lucide.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notificacoes.js"></script>
  <script src="js/servicos.js"></script>
  <script src="js/clientes.js"></script>
  <script src="js/orcamentos.js"></script>
  <script src="js/negociacoes.js"></script>
  <script src="js/projetos.js"></script>
  <script src="js/financeiro.js"></script>
  <script src="js/dados-demo.js"></script>
</body>
</html>
