<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurações — SiteSeller</title>
  <meta name="description" content="Identidade da agência, catálogo de serviços, regras comerciais e dados.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Aplica o tema salvo antes da primeira pintura, evitando piscar. -->
  <script>
    try {
      var c = JSON.parse(localStorage.getItem('siteseller:configuracoes') || 'null');
      if (c && c.tema === 'claro') document.documentElement.dataset.tema = 'claro';
    } catch (e) { /* mantém o tema escuro padrão */ }
  </script>
</head>
<body data-pagina="configuracoes">
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal"></aside>

    <div class="app__principal">
      <header class="topbar" id="topbar"></header>

      <main class="conteudo" id="conteudo" tabindex="-1">
        <header class="pagina__cabecalho">
          <div>
            <p class="sobrelinha">Sistema</p>
            <h2>Configurações</h2>
            <p>Identidade da agência, catálogo de serviços, regras comerciais, aparência e cópia de segurança dos dados.</p>
          </div>
        </header>

        <div class="abas abas--pagina" role="tablist" aria-label="Seções das configurações">
          <button type="button" class="aba" role="tab" data-aba="agencia" aria-controls="painel-agencia">Agência</button>
          <button type="button" class="aba" role="tab" data-aba="catalogo" aria-controls="painel-catalogo">Serviços e preços</button>
          <button type="button" class="aba" role="tab" data-aba="negociacao" aria-controls="painel-negociacao">Regras comerciais</button>
          <button type="button" class="aba" role="tab" data-aba="aparencia" aria-controls="painel-aparencia">Aparência</button>
          <button type="button" class="aba" role="tab" data-aba="dados" aria-controls="painel-dados">Dados e backup</button>
        </div>

        <div id="painel-agencia" role="tabpanel" data-painel="agencia"></div>
        <div id="painel-catalogo" role="tabpanel" data-painel="catalogo" hidden></div>
        <div id="painel-negociacao" role="tabpanel" data-painel="negociacao" hidden></div>
        <div id="painel-aparencia" role="tabpanel" data-painel="aparencia" hidden></div>
        <div id="painel-dados" role="tabpanel" data-painel="dados" hidden></div>
      </main>
    </div>
  </div>

  <noscript><p style="padding:24px;color:#F5E8E7">O SiteSeller precisa de JavaScript ativado para funcionar.</p></noscript>

  <script src="assets/vendor/lucide.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notificacoes.js"></script>
  <script src="js/servicos.js"></script>
  <script src="js/clientes.js"></script>
  <script src="js/orcamentos.js"></script>
  <script src="js/negociacoes.js"></script>
  <script src="js/projetos.js"></script>
  <script src="js/financeiro.js"></script>
  <script src="js/dados-demo.js"></script>
  <script src="js/configuracoes.js"></script>
</body>
</html>
